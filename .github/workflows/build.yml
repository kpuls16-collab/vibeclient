name: Build Vibe Client

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: VibeClient-Project

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Vibe Client
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-client-build
          path: VibeClient-Project/build/libs/*.jar
